name: Run Gosec
on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

jobs:
  Gosec:
    permissions:
      contents: read # Checkout of this internal repository
      actions: read # upload-sarif reads the workflow run on private repositories
      security-events: write

    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Download Go modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/go-mod-download.sh .

      # securego/gosec@master is a Docker action with a prebuilt Go toolchain;
      # build the pinned release with this repository's Go instead.
      - name: Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          # we let the report trigger content trigger a failure using the GitHub Security features.
          "$(go env GOPATH)/bin/gosec" -exclude=G101,G107 -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: results.sarif
