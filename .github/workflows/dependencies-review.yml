name: "Dependency Review"
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: "1.27.2"
          check-latest: true
      - name: Download Go modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/go-mod-download.sh
      # GitHub's dependency-review-action is not run: it needs the repository's
      # Dependency graph setting, which is off. The Socket GitHub app reviews
      # dependency changes on every PR instead, and govulncheck runs below.
      - name: "Dependency audit"
        run: ./scripts/dep-assert.sh
      - name: "Go vulnerability check"
        run: make vulncheck
