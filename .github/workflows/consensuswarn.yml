name: "Warn about consensus code changes"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    permissions:
      contents: read # Checkout of this internal repository
      pull-requests: write # For reading the PR and posting comment
    runs-on: ubuntu-latest
    steps:
      # pull_request_target: this checks out the base branch, never PR code, so
      # the tool and scripts below are trusted while the token can comment.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: Download Go modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/go-mod-download.sh .
      # orijtech/consensuswarn@main is a Docker action built with Go 1.23, which
      # can't load this repository, and it fetches the PR diff from a github.com
      # URL that 404s for private repositories. Build the patched copy vendored
      # in scripts/consensuswarn instead.
      - name: Build consensuswarn
        run: GOWORK=off go build -C scripts/consensuswarn -o bin/consensuswarn .
      - name: Warn about consensus code changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROOTS: "github.com/cosmos/cosmos-sdk/baseapp.BaseApp.PrepareProposal,github.com/cosmos/cosmos-sdk/baseapp.BaseApp.ProcessProposal,github.com/cosmos/cosmos-sdk/baseapp.BaseApp.FinalizeBlock,github.com/cosmos/cosmos-sdk/baseapp.BaseApp.Commit,github.com/cosmos/cosmos-sdk/baseapp.BaseApp.VerifyVoteExtension"
        run: |
          scripts/consensuswarn/bin/consensuswarn \
            -ghtoken "$GITHUB_TOKEN" \
            -apiurl "$GITHUB_API_URL" \
            -repository "$GITHUB_REPOSITORY" \
            -pr "$PR_NUMBER" \
            -roots "$ROOTS"
