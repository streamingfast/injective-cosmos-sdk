name: Lint
# Runs golangci-lint on the modules a pull request touches and reports only
# issues introduced since the merge base with the PR's base branch, so
# pre-existing findings in fork code don't fail unrelated changes.
# Locally: `make lint` (LINT_BASE defaults to origin/v0.50.x-inj).
on:
  pull_request:
permissions:
  contents: read
jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the PR's base branch needs full history.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      - name: Download Go modules
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./scripts/go-mod-download.sh
      - name: Lint
        env:
          LINT_BASE: origin/${{ github.base_ref }}
        run: make lint
