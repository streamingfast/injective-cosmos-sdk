# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# docs/ is not tracked: the upstream docs site is not maintained in this fork.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "01:00"
    ignore:
      # v5 is broken, ref https://github.com/actions/labeler/issues/712
      - dependency-name: "actions/labeler"
        update-types: ["version-update:semver-major"]
      # confix and cosmovisor releases pin goreleaser v0.179.0 with --rm-dist
      - dependency-name: "goreleaser/goreleaser-action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directories:
      - "/"
      - "/api"
      - "/client/v2"
      - "/collections"
      - "/core"
      - "/depinject"
      - "/errors"
      - "/log"
      - "/math"
      - "/scripts/consensuswarn"
      - "/simapp"
      - "/store"
      - "/tests"
      - "/tools/confix"
      - "/tools/cosmovisor"
      - "/tools/hubl"
      - "/x/circuit"
      - "/x/evidence"
      - "/x/feegrant"
      - "/x/nft"
      - "/x/tx"
      - "/x/upgrade"
    schedule:
      interval: weekly
      day: monday
      time: "01:05"
    labels:
      - "A:automerge"
      - dependencies
    ignore:
      # Fork-owned modules, replaced by InjectiveLabs versions downstream.
      - dependency-name: "cosmossdk.io/*"
      - dependency-name: "github.com/cosmos/cosmos-sdk"
      # Pinned to InjectiveLabs forks via replace directives.
      - dependency-name: "github.com/cometbft/cometbft"
      - dependency-name: "github.com/cometbft/cometbft/api"
      - dependency-name: "github.com/cosmos/iavl"
